name: Deploy Premium Cuts Listed
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - name: Build static archive
        env:
          SITE_ORIGIN: https://djnaoyaman.github.io/premiumcuts
          BASE_PATH: /premiumcuts
        run: python build.py
      - name: Render representative social previews
        env:
          BASE_PATH: /premiumcuts
        run: python scripts/render_social_cards.py --sample
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-samples
          path: |
            dist/social/
            dist/social-card-sample-report.json
          retention-days: 7
      - name: Render faithful page-specific social previews
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        env:
          BASE_PATH: /premiumcuts
        run: python scripts/render_social_cards.py
      - name: Verify fixed catalog and collection isolation
        run: |
          python scripts/verify_home_index.py
          python scripts/verify_about_gallery.py
          python scripts/verify_about_profile.py
          python scripts/verify_labels.py
          python scripts/verify_fixed.py
          python scripts/verify_catalog.py
          python scripts/verify_metadata.py ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '--structure-only' || '' }}
          python scripts/verify_navigation.py
          node scripts/verify_scope.cjs
          node scripts/verify_catalog_header.cjs
          node scripts/verify_random_start.cjs
          python scripts/verify_analytics.py
          node scripts/verify_analytics.cjs
          node scripts/verify_fullscreen_art.cjs
          node scripts/verify_player.cjs
          node scripts/verify_back_to_top.cjs
          node scripts/verify_home_intro.cjs
          node scripts/verify_one_note_samba.cjs
      - name: Verify fullscreen ART in Chromium
        run: python scripts/verify_fullscreen_art_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-art-review
          path: qa/fullscreen-art/
          retention-days: 7
      - name: Verify homepage intro in Chromium
        run: python scripts/verify_home_intro_browser.py
      - name: Verify Songs control in Chromium
        run: python scripts/verify_back_to_top_browser.py
      - name: Verify Spinout navigation in Chromium
        run: python scripts/verify_spinout_browser.py
      - name: Verify Essentials experience in Chromium
        run: python scripts/verify_essentials_experience_browser.py
      - name: Verify Premium hint in Chromium
        run: python scripts/verify_premium_hint_browser.py
      - name: Verify About reveal in Chromium
        run: python scripts/verify_about_reveal_browser.py
      - name: Verify One Note Samba feature in Chromium
        run: python scripts/verify_one_note_samba_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-browser-qa
          path: qa/
          retention-days: 7
      - name: Upload social preview review artifacts
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        uses: actions/upload-artifact@v4
        with:
          name: social-previews
          path: |
            dist/social/
            dist/social-card-manifest.json
            dist/social-card-report.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
