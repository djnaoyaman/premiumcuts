name: Deploy Premium Cuts Listed
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - name: Build static archive
        env:
          SITE_ORIGIN: https://djnaoyaman.github.io/premiumcuts
          BASE_PATH: /premiumcuts
        run: python build.py
      - name: Render representative social previews
        env:
          BASE_PATH: /premiumcuts
        run: python scripts/render_social_cards.py --sample
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-samples
          path: |
            dist/social/
            dist/social-card-sample-report.json
          retention-days: 7
      - name: Render faithful page-specific social previews
        env:
          BASE_PATH: /premiumcuts
        run: python scripts/render_social_cards.py
      - name: Verify fixed catalog and collection isolation
        run: |
          python scripts/verify_home_index.py
          python scripts/verify_about_gallery.py
          python scripts/verify_about_profile.py
          python scripts/verify_labels.py
          python scripts/verify_fixed.py
          python scripts/verify_catalog.py
          python scripts/verify_metadata.py
          python scripts/verify_navigation.py
          node scripts/verify_scope.cjs
          node scripts/verify_catalog_header.cjs
          node scripts/verify_random_start.cjs
          node scripts/verify_player.cjs
          node scripts/verify_back_to_top.cjs
      - name: Verify Songs control in Chromium
        run: python scripts/verify_back_to_top_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: back-to-top-browser-qa
          path: qa/back-to-top/
          retention-days: 7
      - name: Upload social preview review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: social-previews
          path: |
            dist/social/
            dist/social-card-manifest.json
            dist/social-card-report.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
